name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:budget
        env:
          VITE_SUPABASE_URL: https://fgpthpxmiroyebrzjdzo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_ALLOWED_SUPABASE_PROJECT_IDS: fgpthpxmiroyebrzjdzo
          ALLOWED_SUPABASE_PROJECT_IDS: fgpthpxmiroyebrzjdzo
      - run: npm run check:assets

name: Production deploy

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

env:
  WORKER_NAME: lovable-opus-form
  PRODUCTION_URL: https://opusform.co.uk
  SUPABASE_PROJECT_ID: fgpthpxmiroyebrzjdzo

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require recovery inputs before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          PRODUCTION_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
          PRODUCTION_SMOKE_ACCOUNTS_JSON: ${{ secrets.PRODUCTION_SMOKE_ACCOUNTS_JSON }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ -n "$PRODUCTION_SMOKE_ACCOUNTS_JSON" ]; then
            node -e 'const accounts = JSON.parse(process.env.PRODUCTION_SMOKE_ACCOUNTS_JSON); if (!Array.isArray(accounts) || accounts.length === 0) process.exit(1);'
          else
            test -n "$PRODUCTION_SMOKE_EMAIL"
            test -n "$PRODUCTION_SMOKE_PASSWORD"
          fi
      - name: Build the immutable production artifact
        env:
          VITE_SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_ID }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.run_started_at }}
          VITE_ALLOWED_SUPABASE_PROJECT_IDS: ${{ env.SUPABASE_PROJECT_ID }}
          ALLOWED_SUPABASE_PROJECT_IDS: ${{ env.SUPABASE_PROJECT_ID }}
        run: npm run build:budget
      - run: npm run check:assets
      - name: Capture the current Worker version before deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments status --name "$WORKER_NAME" --json > /tmp/current-worker-deployment.json
          node scripts/select-worker-version.mjs /tmp/current-worker-deployment.json > /tmp/previous-worker-version
          echo "Currently deployed Worker version captured for guarded rollback."
      - name: Deploy the exact built artifact
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy --config wrangler.jsonc --message "${GITHUB_SHA}"
      - name: Verify public liveness, Supabase readiness, login, and screens
        id: watchdog
        continue-on-error: true
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SUPABASE_PROJECT_ID: ${{ env.SUPABASE_PROJECT_ID }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
          SMOKE_ACCOUNTS_JSON: ${{ secrets.PRODUCTION_SMOKE_ACCOUNTS_JSON }}
          WATCHDOG_RESULT_FILE: /tmp/watchdog-result.json
        run: npm run watchdog
      - name: Roll back only a demonstrable frontend failure
        id: rollback
        if: steps.watchdog.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          category=$(jq -r '.category // "unknown"' /tmp/watchdog-result.json 2>/dev/null || echo unknown)
          if [ "$category" != "frontend" ]; then
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            echo "Skipping rollback for $category; dependency/auth failures remain human-owned."
            exit 0
          fi
          test -s /tmp/previous-worker-version
          target=$(cat /tmp/previous-worker-version)
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "succeeded=false" >> "$GITHUB_OUTPUT"
          npx wrangler rollback "$target" --name "$WORKER_NAME" --yes --message "Post-deploy frontend smoke failure for ${GITHUB_SHA}"
          echo "succeeded=true" >> "$GITHUB_OUTPUT"
      - name: Verify rollback Worker version is active
        id: rollback-version-check
        if: steps.rollback.outputs.attempted == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_TARGET: ${{ steps.rollback.outputs.target }}
        run: |
          npx wrangler deployments status --name "$WORKER_NAME" --json > /tmp/recovered-worker-deployment.json
          active=$(node scripts/select-worker-version.mjs /tmp/recovered-worker-deployment.json)
          test "$active" = "$ROLLBACK_TARGET"
      - name: Verify rollback recovery
        id: rollback-check
        if: steps.rollback-version-check.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SUPABASE_PROJECT_ID: ${{ env.SUPABASE_PROJECT_ID }}
          SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
          SMOKE_ACCOUNTS_JSON: ${{ secrets.PRODUCTION_SMOKE_ACCOUNTS_JSON }}
          WATCHDOG_RESULT_FILE: /tmp/rollback-result.json
        run: npm run watchdog
      - name: Send failure alert
        if: always() && (failure() || steps.deploy.outcome == 'failure' || steps.watchdog.outcome == 'failure' || steps.rollback.outcome == 'failure' || steps.rollback-version-check.outcome == 'failure' || steps.rollback-check.outcome == 'failure')
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          result=/tmp/watchdog-result.json
          category=$(jq -r '.category // "unknown"' "$result" 2>/dev/null || echo unknown)
          build_sha=$(jq -r '.buildSha // "unknown"' "$result" 2>/dev/null || echo unknown)
          expected_sha=$(jq -r '.expectedBuildSha // "unknown"' "$result" 2>/dev/null || echo unknown)
          failures=$(jq -c '.failures // []' "$result" 2>/dev/null || echo '[]')
          recovery_result=/tmp/rollback-result.json
          recovery_status="${{ steps.rollback-check.outcome || 'not-run' }}"
          recovery_category=$(jq -r '.category // "not-run"' "$recovery_result" 2>/dev/null || echo not-run)
          recovery_failures=$(jq -c '.failures // []' "$recovery_result" 2>/dev/null || echo '[]')
          recovery_outcome="${{ steps.rollback-check.outcome || 'not-run' }}"
          version_outcome="${{ steps.rollback-version-check.outcome || 'not-run' }}"
          payload=$(jq -cn --arg category "$category" --arg buildSha "$build_sha" --arg expectedBuildSha "$expected_sha" --argjson failures "$failures" --arg recoveryStatus "$recovery_status" --arg recoveryCategory "$recovery_category" --argjson recoveryFailures "$recovery_failures" --arg rollbackAttempted "${{ steps.rollback.outputs.attempted || 'false' }}" --arg rollbackSucceeded "${{ steps.rollback.outputs.succeeded || 'false' }}" --arg rollbackTarget "${{ steps.rollback.outputs.target || '' }}" --arg rollbackVersionVerification "$version_outcome" --arg rollbackSmokeVerification "$recovery_outcome" --arg commit "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{service:"opus-form",event:"production-deploy-failed",category:$category,buildSha:$buildSha,expectedBuildSha:$expectedBuildSha,failures:$failures,rollbackAttempted:$rollbackAttempted,rollbackSucceeded:$rollbackSucceeded,rollbackTarget:$rollbackTarget,rollbackVersionVerification:$rollbackVersionVerification,rollbackSmokeVerification:$rollbackSmokeVerification,recoveryStatus:$recoveryStatus,recoveryCategory:$recoveryCategory,recoveryFailures:$recoveryFailures,commit:$commit,run:$run}')
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl --fail-with-body --max-time 10 -X POST -H 'content-type: application/json' --data "$payload" "$ALERT_WEBHOOK_URL"
          else
            echo "OPS_ALERT_WEBHOOK_URL is not configured; GitHub Actions failure remains the alert."
          fi
      - name: Fail the workflow after recording the recovery result
        if: steps.deploy.outcome == 'failure' || steps.watchdog.outcome == 'failure' || steps.rollback.outcome == 'failure' || steps.rollback-version-check.outcome == 'failure' || steps.rollback-check.outcome == 'failure'
        run: exit 1
